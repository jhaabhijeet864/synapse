[package]
name = "synapse"
version = "0.1.0"
description = "Synapse - The AI that lives between your brain and your computer"
authors = ["Synapse Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image",
  "image-png",
  "image-ico",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
