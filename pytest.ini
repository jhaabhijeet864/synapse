[pytest]
testpaths = tests
asyncio_mode = auto
# NOTE (local dev, Windows): if plain `pytest` crashes inside a third-party
# plugin at collection (seen: deepeval + pydantic-settings SettingsError),
# that is environment pollution, not this repo. Run instead:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests -q -p asyncio -p no:cacheprovider
# CI installs only core/requirements.txt, so plain `pytest` works there.
